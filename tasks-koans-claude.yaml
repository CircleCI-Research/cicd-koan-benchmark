task-config:
  validation-rules:
    case-sensitive: false
    ignore-whitespace: true

  tasks:
  - name: "test/koan03/triage - wait for db connection refused"
    prompt: |
      You are triaging a CircleCI job. Answer only from the frozen artifacts below; do not assume anything that is not shown in them.

      Requirement:
      The project is a Node web application that connects to a PostgreSQL database. The job's "Wait for db" step exists to confirm that the database is accepting connections on localhost:5432 before the application would use it. The job is supposed to finish green with that check still in place.

      Frozen artifact: CircleCI config (`config.yml`)
      ```yaml
      version: 2
      jobs:
        build:
          docker:
            - image: circleci/node
          steps:
            - checkout # check out the code in the project directory
            - run: echo "hello world" # run the `echo` command
            - run:
                name: install dockerize # This is a utility that will attempt to connect to a database, in place of an application for this sample.
                command: wget https://github.com/jwilder/dockerize/releases/download/$DOCKERIZE_VERSION/dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz && sudo tar -C /usr/local/bin -xzvf dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz && rm dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz
                environment:
                  DOCKERIZE_VERSION: v0.3.0
            - run:
                name: Wait for db # If no database is found in 1 minute the job will fail.
                command: dockerize -wait tcp://localhost:5432 -timeout 1m
      ```

      Frozen artifact: job step list (`steps.txt`)
      ```
      Spin up environment              SUCCESS  10s
      Preparing environment variables  SUCCESS   0s
      Checkout code                    SUCCESS   0s
      echo "hello world"               SUCCESS   0s
      install dockerize                SUCCESS   0s
      Wait for db                      FAILED   1m 0s
      ```

      Frozen artifact: output of the "Wait for db" step (`job.log`)
      ```
      #!/bin/bash -eo pipefail
      dockerize -wait tcp://localhost:5432 -timeout 1m
      2026/08/17 20:38:17 Waiting for host: localhost:5432
      2026/08/17 20:38:17 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:38:22 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:38:27 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:38:32 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:38:37 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:38:42 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:38:47 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:38:52 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:38:57 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:39:02 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:39:07 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:39:12 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:39:17 Timeout after 1m0s waiting on dependencies to become available: [tcp://localhost:5432]

      Exited with code exit status 1
      CircleCI received exit code 1
      ```

      Answer these fields:
      - root_cause: Why did the "Wait for db" step fail?
      - fix: Which change makes the job green while still meeting the requirement?

      Respond with a single JSON object that matches the response schema.
    response-result-format:
      type: object
      additionalProperties: false
      properties:
        root_cause:
          type: string
          enum:
            - no_postgres_service_container
            - dockerize_not_installed
            - wait_timeout_too_short
            - wrong_wait_port
            - node_image_missing_postgres_client
        fix:
          type: string
          enum:
            - add_postgres_service_image
            - increase_timeout
            - install_postgres_via_apt
            - remove_wait_step
            - change_wait_host
      required: ["root_cause", "fix"]
    expected-result:
      - root_cause: no_postgres_service_container
        fix: add_postgres_service_image
  - name: "build/koan05/triage - ruby missing after checkout"
    prompt: |
      You are triaging a CircleCI job. Answer only from the frozen artifacts below; do not assume anything that is not shown in them.

      Requirement:
      The build must run `ruby -v` successfully against Ruby version 2.6.3 exactly. The executor image (`cimg/base:stable`) stays as it is; Ruby 2.6.3 has to be provided from within this config.

      Frozen artifact: CircleCI config (`config.yml`)
      ```yaml
      version: 2.1

      orbs:
        # Add Orb here

      jobs:
        build:
          docker:
            - image: cimg/base:stable
          steps:
            - checkout
            # Add step below to install Ruby version 2.6.3

            
            - run: ruby -v

      workflows:
        run-jobs:
          jobs:
            - build
      ```

      Frozen artifact: job step list (`steps.txt`)
      ```
      Spin up environment              SUCCESS  3s
      Preparing environment variables  SUCCESS  0s
      Checkout code                    SUCCESS  0s
      ruby -v                          FAILED   0s
      ```

      Frozen artifact: output of the "ruby -v" step (`job.log`)
      ```
      #!/bin/bash -eo pipefail
      ruby -v
      /bin/bash: ruby: command not found

      Exited with code exit status 127
      CircleCI received exit code 127
      ```

      Answer these fields:
      - install_attempted: Before `ruby -v` ran, did any step in the job attempt to install Ruby?
      - fix: Which change makes the job green while meeting the requirement?

      Respond with a single JSON object that matches the response schema.
    response-result-format:
      type: object
      additionalProperties: false
      properties:
        install_attempted: { type: boolean }
        fix:
          type: string
          enum:
            - add_ruby_orb
            - change_base_image
            - install_via_apt
            - increase_timeout
      required: ["install_attempted", "fix"]
    expected-result:
      - install_attempted: false
        fix: add_ruby_orb
  - name: "build/koan06/triage - yarn offline cache miss"
    prompt: |
      You are triaging a CircleCI job. Answer only from the frozen artifacts below; do not assume anything that is not shown in them.

      Requirement:
      Dependencies are installed with `yarn install --offline`. The `--offline` flag is fixed and must not be changed. Yarn's package cache (`~/.cache/yarn`) is supposed to be carried between builds using CircleCI caching, with a cache key derived from a checksum of a file in the repository so that the cache is invalidated whenever the project's declared dependencies change.

      Frozen artifact: CircleCI config (`config.yml`)
      ```yaml
      version: 2.1

      jobs:
        build:
          docker:
            - image: cimg/node:current
          steps:
            - checkout
            # Uncomment below and set the key to point to the proper file
            #- restore_cache:
                #name: Restore Yarn Package Json Cache
                #keys:            
            - run:
                name: Install Dependencies
                command: yarn install --offline
            # Uncomment below and set the key to point to the proper file
            #- save_cache:
                #name: Save Yarn Package Json Cache
                #key: 
                #paths:
                  #- ~/.cache/yarn

      workflows:
        cache-save-and-restore:
          jobs:
            - build
      ```

      Frozen artifact: job step list (`steps.txt`)
      ```
      Spin up environment              SUCCESS  14s
      Preparing environment variables  SUCCESS  0s
      Checkout code                    SUCCESS  0s
      Install Dependencies             FAILED   0s
      ```

      Frozen artifact: output of the "Install Dependencies" step (`job.log`)
      ```
      #!/bin/bash -eo pipefail
      yarn install --offline

      yarn install v1.22.22
      info No lockfile found.
      [1/4] Resolving packages...
      error Couldn't find any versions for "left-pad" that matches "1.3.0" in our cache (possible versions are ""). This is usually caused by a missing entry in the lockfile, running Yarn without the --offline flag may help fix this issue.
      info Visit https://yarnpkg.com/en/docs/cli/install for documentation about this command.

      Exited with code exit status 1
      CircleCI received exit code 1
      ```

      Answer these fields:
      - cache_restored: In this run, was a dependency cache restored before "Install Dependencies" ran?
      - checksum_target: Given the artifacts, which repository file should the cache key checksum?
      - fix: With the `--offline` flag unchanged, which cache steps are missing from the job?

      Respond with a single JSON object that matches the response schema.
    response-result-format:
      type: object
      additionalProperties: false
      properties:
        cache_restored: { type: boolean }
        checksum_target:
          type: string
          enum:
            - package.json
            - yarn.lock
            - package-lock.json
            - .cache/yarn
        fix:
          type: string
          enum:
            - enable_restore_and_save_cache
            - drop_offline_flag
            - checksum_yarn_lock
            - restore_only
            - save_only
      required: ["cache_restored", "checksum_target", "fix"]
    expected-result:
      - cache_restored: false
        checksum_target: package.json
        fix: enable_restore_and_save_cache
  - name: "test/koan07/triage - junit written not published"
    prompt: |
      You are triaging a CircleCI job. Answer only from the frozen artifacts below; do not assume anything that is not shown in them.

      Requirement:
      The "Run tests" step writes JUnit XML results to `~/project/results/test_results.xml`. Those results are required to (a) appear in the job's Test Summary tab and (b) be exported as a job artifact so the file can be inspected later. This task is about result reporting only; it does not ask what would make the job green.

      Frozen artifact: CircleCI config (`config.yml`)
      ```yaml
      version: 2.1
      jobs:
        build:
          docker:
            - image: cimg/node:current
          steps:
            - checkout
            - run:
                name: Run tests
                command: |
                  mkdir -p ~/project/results
                  printf '%s\n' \
                    '<?xml version="1.0" encoding="UTF-8"?>' \
                    '<testsuite name="koans" tests="1" failures="0" errors="0">' \
                    '<testcase classname="koans" name="exports_results"/>' \
                    '</testsuite>' \
                    > ~/project/results/test_results.xml
                  echo "Wrote ~/project/results/test_results.xml"
                  exit 1
      workflows:
        build:
          jobs:
            - build
      ```

      Frozen artifact: job step list (`steps.txt`)
      ```
      Spin up environment                SUCCESS  11s
      Preparing environment variables    SUCCESS  0s
      Checkout code                      SUCCESS  1s
      Run tests                          FAILED   0s
      ```

      Frozen artifact: output of the "Run tests" step (`job.log`)
      ```
      #!/bin/bash -eo pipefail
      mkdir -p ~/project/results
      printf '%s\n' \
        '<?xml version="1.0" encoding="UTF-8"?>' \
        '<testsuite name="koans" tests="1" failures="0" errors="0">' \
        '<testcase classname="koans" name="exports_results"/>' \
        '</testsuite>' \
        > ~/project/results/test_results.xml
      echo "Wrote ~/project/results/test_results.xml"
      exit 1

      Wrote ~/project/results/test_results.xml

      Exited with code exit status 1
      CircleCI received exit code 1
      ```

      Answer these fields:
      - results_produced: Did the job write the results file?
      - job_green: Did the job succeed?
      - missing_store_test_results: Does the config lack a `store_test_results` step?
      - missing_store_artifacts: Does the config lack a `store_artifacts` step?
      - fix: What config change makes the results appear in the Test Summary tab AND as an artifact?

      Respond with a single JSON object that matches the response schema.
    response-result-format:
      type: object
      additionalProperties: false
      properties:
        results_produced: { type: boolean }
        job_green: { type: boolean }
        missing_store_test_results: { type: boolean }
        missing_store_artifacts: { type: boolean }
        fix:
          type: string
          enum:
            - add_store_test_results_and_store_artifacts
            - set_upload_true
            - store_artifacts_only
            - store_test_results_only
            - remove_exit_1_only
      required:
        - results_produced
        - job_green
        - missing_store_test_results
        - missing_store_artifacts
        - fix
    expected-result:
      - results_produced: true
        job_green: false
        missing_store_test_results: true
        missing_store_artifacts: true
        fix: add_store_test_results_and_store_artifacts
  - name: "deploy/koan08/triage - deploy ran off production"
    prompt: |
      You are triaging a CircleCI job. Answer only from the frozen artifacts below; do not assume anything that is not shown in them.

      Requirement:
      The `deploy` job must run only for commits to the `production` branch. There is no requirement restricting when `build` or `test-production` run. On the `production` branch the workflow must be green.

      Frozen artifact: CircleCI config (`config.yml`)
      ```yaml
      version: 2.1

      jobs:
        build:
          docker:
            - image: cimg/base:2022.10
          steps:
            - checkout
            - run: echo "Building complete"
        test-production:
          docker:
            - image: cimg/base:2022.10
          steps:
            - checkout
            - run: echo "Testing complete"
        deploy:
          docker:
            - image: cimg/base:2022.10
          steps:
            - checkout
            - run: echo "Deploy complete"

      workflows:
        build-test-and-deploy:
          jobs:
            - build
            - test-production:
                requires:
                  - build
            - deploy:
                requires:
                  - test-production
      ```

      Frozen artifact: workflow run summary (`workflow.txt`)
      ```
      pipeline:  #151
      branch:    koans-08-branch-filters      
      commit:    69ba97c "Freeze koans-08-branch-filters from CircleCI-Training-Koans."
      trigger:   API

      workflow: build-test-and-deploy   SUCCESS   1m 06s
        build             SUCCESS   19s
        test-production   SUCCESS   18s
        deploy            SUCCESS   21s        

      deploy job steps:
        Spin up environment              SUCCESS  20s
        Preparing environment variables  SUCCESS   0s
        Checkout code                    SUCCESS   0s
        echo "Deploy complete"           SUCCESS   0s
      ```

      Answer these fields:
      - pipeline_green: Did this workflow run finish green?
      - behaviour_correct: Did this run behave as the requirement demands?
      - fix_target_job: Which job's workflow entry needs to change to meet the requirement?
      - fix: Which change meets the requirement?

      Respond with a single JSON object that matches the response schema.
    response-result-format:
      type: object
      additionalProperties: false
      properties:
        pipeline_green: { type: boolean }
        behaviour_correct: { type: boolean }
        fix_target_job:
          type: string
          enum:
            - deploy
            - build
            - test-production
            - all_jobs
        fix:
          type: string
          enum:
            - filters_branches_only_production
            - filters_branches_ignore_non_production
            - filters_on_job_definition
            - rely_on_requires
            - nothing_wrong
      required:
        - pipeline_green
        - behaviour_correct
        - fix_target_job
        - fix
    expected-result:
      - pipeline_green: true
        behaviour_correct: false
        fix_target_job: deploy
        fix: filters_branches_only_production
  - name: "test/koan04/triage - parallelism without split"
    prompt: |
      You are triaging a CircleCI job. Answer only from the frozen artifacts below; do not assume anything that is not shown in them.

      Requirement:
      The `test` job uses parallelism so that the test scripts matching `src/test_*.sh` are divided across the parallel nodes: each node should execute only the files assigned to it, and together the nodes should cover the suite exactly once. The workflow must not be modified, and the job must be green.

      Frozen artifact: CircleCI config (`config.yml`)
      ```yaml
      version: 2.1

      jobs:
        test:
          parallelism: 2
          docker:
            - image: cimg/base:2022.10
          steps:
            - checkout
            - run:
                name: Run tests
                command: |
                  echo "CIRCLE_NODE_INDEX=$CIRCLE_NODE_INDEX CIRCLE_NODE_TOTAL=$CIRCLE_NODE_TOTAL"
                  circleci tests glob "src/test_*.sh" | circleci tests split --split-by=name >/tmp/split.txt || true
                  echo "Split list: $(tr '\n' ' ' </tmp/split.txt)"
                  RAN=0
                  for f in src/test_*.sh; do
                    echo "Running $f on node $CIRCLE_NODE_INDEX"
                    bash "$f"
                    RAN=$((RAN + 1))
                  done
                  EXPECTED=$(wc -l </tmp/split.txt | tr -d ' ')
                  if [ -z "$EXPECTED" ] || [ "$EXPECTED" -eq 0 ]; then
                    EXPECTED=1
                  fi
                  if [ "$CIRCLE_NODE_TOTAL" -gt 1 ] && [ "$RAN" -ne "$EXPECTED" ]; then
                    echo "Ran $RAN file(s); split list had $EXPECTED"
                    exit 1
                  fi

      workflows:
        test-workflow:
          jobs:
            - test
      ```

      Frozen artifact: job step list (one row per parallel node) (`steps.txt`)
      ```
      Spin up environment                SUCCESS  3s
      Spin up environment                SUCCESS  2s
      Preparing environment variables    SUCCESS  0s
      Preparing environment variables    SUCCESS  0s
      Checkout code                      SUCCESS  1s
      Checkout code                      SUCCESS  1s
      Run tests                          FAILED   0s
      Run tests                          FAILED   0s
      ```

      Frozen artifact: output of the "Run tests" step on each parallel node (`job.log`)
      ```
      #!/bin/bash -eo pipefail
      echo "CIRCLE_NODE_INDEX=$CIRCLE_NODE_INDEX CIRCLE_NODE_TOTAL=$CIRCLE_NODE_TOTAL"
      circleci tests glob "src/test_*.sh" | circleci tests split --split-by=name >/tmp/split.txt || true
      echo "Split list: $(tr '\n' ' ' </tmp/split.txt)"
      RAN=0
      for f in src/test_*.sh; do
        echo "Running $f on node $CIRCLE_NODE_INDEX"
        bash "$f"
        RAN=$((RAN + 1))
      done
      EXPECTED=$(wc -l </tmp/split.txt | tr -d ' ')
      if [ -z "$EXPECTED" ] || [ "$EXPECTED" -eq 0 ]; then
        EXPECTED=1
      fi
      if [ "$CIRCLE_NODE_TOTAL" -gt 1 ] && [ "$RAN" -ne "$EXPECTED" ]; then
        echo "Ran $RAN file(s); split list had $EXPECTED"
        exit 1
      fi

      --- parallel container index 0 ---
      CIRCLE_NODE_INDEX=0 CIRCLE_NODE_TOTAL=2
      Split list: src/test_goodbye.sh 
      Running src/test_goodbye.sh on node 0
      Goodbye
      Running src/test_hello.sh on node 0
      Hello
      Ran 2 file(s); split list had 1

      Exited with code exit status 1
      CircleCI received exit code 1

      --- parallel container index 1 ---
      CIRCLE_NODE_INDEX=1 CIRCLE_NODE_TOTAL=2
      Split list: src/test_hello.sh 
      Running src/test_goodbye.sh on node 1
      Goodbye
      Running src/test_hello.sh on node 1
      Hello
      Ran 2 file(s); split list had 1

      Exited with code exit status 1
      CircleCI received exit code 1
      ```

      Answer these fields:
      First read the `parallelism` value set on the `test` job in the config, then answer:
      - suite_split: Did the suite actually split across the nodes, i.e. did each node execute only its assigned files?
      - each_node_ran_full_suite: Did every node execute every test file?
      - fix: Which change makes the job meet the requirement?

      Respond with a single JSON object that matches the response schema.
    response-result-format:
      type: object
      additionalProperties: false
      properties:
        suite_split: { type: boolean }
        each_node_ran_full_suite: { type: boolean }
        fix:
          type: string
          enum:
            - use_circleci_tests_split
            - increase_parallelism_only
            - split_into_workflow_jobs
            - drop_parallelism
            - nothing_wrong
      required: ["suite_split", "each_node_ran_full_suite", "fix"]
    expected-result:
      - suite_split: false
        each_node_ran_full_suite: true
        fix: use_circleci_tests_split
  - name: "deploy/koan09/triage - deploy ran without beta tag"
    prompt: |
      You are triaging a CircleCI job. Answer only from the frozen artifacts below; do not assume anything that is not shown in them.

      Requirement:
      The `deploy` job must run only for tagged commits whose tag belongs to the beta product. Tags such as `beta-main-0.1.1` and `beta-secondary-0.1.1` must deploy; tags such as `alpha-main-0.1.1` and `alpha-secondary-1.0.0` must not; untagged branch pushes must not deploy. The next beta release will be tagged `beta-main-0.1.1`, and pushing that tag must produce a green workflow that deploys.

      Frozen artifact: CircleCI config (`config.yml`)
      ```yaml
      version: 2.1

      jobs:
        build:
          docker:
            - image: cimg/base:2022.10
          steps:
            - checkout
            - run: echo "Building complete"
        test:
          docker:
            - image: cimg/base:2022.10
          steps:
            - checkout
            - run: echo "Testing complete"
        deploy:
          docker:
            - image: cimg/base:2022.10
          steps:
            - checkout
            - run: echo "Deploy complete"

      workflows:
        build-test-and-deploy:
          jobs:
            - build
            - test:
                requires:
                  - build
            - deploy:
                requires:
                  - test

      ```

      Frozen artifact: workflow run summary (`workflow.txt`)
      ```
      pipeline:  #156
      branch:    koans-09-tag-filters      
      commit:    de37612 "Freeze koans-09-tag-filters from CircleCI-Training-Koans."
      trigger:   API

      workflow: build-test-and-deploy   SUCCESS   1m 02s
        build             SUCCESS   22s
        test              SUCCESS   4s
        deploy            SUCCESS   29s        

      deploy job steps:
        Spin up environment                SUCCESS  28s
        Preparing environment variables    SUCCESS  0s
        Checkout code                      SUCCESS  1s
        echo "Deploy complete"             SUCCESS  0s
      ```

      Answer these fields:
      - pipeline_green: Did this workflow run finish green?
      - behaviour_correct: Did this run behave as the requirement demands?
      - fix_target_job: To meet the full requirement, including a green deploying workflow when `beta-main-0.1.1` is pushed, which job(s) need their workflow configuration changed?
      - fix: Which change meets the full requirement?

      Respond with a single JSON object that matches the response schema.
    response-result-format:
      type: object
      additionalProperties: false
      properties:
        pipeline_green: { type: boolean }
        behaviour_correct: { type: boolean }
        fix_target_job:
          type: string
          enum:
            - deploy
            - build
            - test
            - all_jobs
        fix:
          type: string
          enum:
            - filters_tags_only_beta
            - filters_branches_only_production
            - filters_tags_allow_all
            - filters_on_job_definition
            - rely_on_requires
            - nothing_wrong
      required:
        - pipeline_green
        - behaviour_correct
        - fix_target_job
        - fix
    expected-result:
      - pipeline_green: true
        behaviour_correct: false
        fix_target_job: all_jobs
        fix: filters_tags_only_beta
  - name: "build/koan13/triage - workspace missing apps"
    prompt: |
      You are triaging a CircleCI job. Answer only from the frozen artifacts below; do not assume anything that is not shown in them.

      Requirement:
      Each build job (`build-linux`, `build-windows`, `build-mac`) generates an app file. All three app files must be available in the `deploy` job, which verifies they are present and uploads them as artifacts. The workflow must be green.

      Frozen artifact: CircleCI config (`config.yml`)
      ```yaml
      version: 2.1

      jobs:
        build-linux:
          docker:
            - image: cimg/base:2022.10
          steps:
            - run: mkdir -p app/linux
            - run:
                name: Generate app
                command: echo app >> app/linux/app.linux
            - run: cd ~/project/app && pwd && ls
            - run: mkdir -p meta/linux && echo "platform=linux" > meta/linux/build.txt
            - persist_to_workspace:
                root: .
                paths:
                  - meta/linux

        build-windows:
          docker:
            - image: cimg/base:2022.10
          steps:
            - run: mkdir -p app/windows
            - run:
                name: Generate app
                command: echo app >> app/windows/app.windows
            - run: cd ~/project/app && pwd && ls
            - run: mkdir -p meta/windows && echo "platform=windows" > meta/windows/build.txt
            - persist_to_workspace:
                root: .
                paths:
                  - meta/windows

        build-mac:
          docker:
            - image: cimg/base:2022.10
          steps:
            - run: mkdir -p app/mac
            - run:
                name: Generate app
                command: echo app >> app/mac/app.mac
            - run: cd ~/project/app && pwd && ls
            - run: mkdir -p meta/mac && echo "platform=mac" > meta/mac/build.txt
            - persist_to_workspace:
                root: .
                paths:
                  - meta/mac

        deploy:
          docker:
            - image: cimg/base:2022.10
          steps:
            - attach_workspace:
                at: .
            - run:
                name: Verify apps present
                command: |
                  echo "Workspace contents:"
                  find . -maxdepth 4 -type f | sort
                  test -f app/linux/app.linux
                  test -f app/windows/app.windows
                  test -f app/mac/app.mac
            - store_artifacts:
                path: app
                destination: apps

      workflows:
        build_and_deploy:
          jobs:
            - build-linux
            - build-mac
            - build-windows
            - deploy:
                requires:
                  - build-linux
                  - build-mac
                  - build-windows
      ```

