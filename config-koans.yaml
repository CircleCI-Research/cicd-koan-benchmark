# config-koans.yaml

config:
  # ------ CLAUDE SETUP -------
  log-file: "./results/koans-claude/run.log"
  output-dir: "./results/koans-claude/{{.Year}}-{{.Month}}-{{.Day}}/"
  output-basename: "results-claude-{{.Hour}}-{{.Minute}}-{{.Second}}"
  task-source: "./tasks-koans-claude.yaml"

  # ------ CHAT SETUP ---------
  # log-file: "./results/koans-chat/run.log"
  # output-dir: "./results/koans-chat/{{.Year}}-{{.Month}}-{{.Day}}/"
  # output-basename: "results-chat-{{.Hour}}-{{.Minute}}-{{.Second}}"
  # task-source: "./tasks-koans-chat.yaml"

  # ----- GEMINI SETUP --------
  # log-file: "./results/koans-gemini/run.log"
  # output-dir: "./results/koans-gemini/{{.Year}}-{{.Month}}-{{.Day}}/"
  # output-basename: "results-gemini-{{.Hour}}-{{.Minute}}-{{.Second}}"
  # task-source: "./tasks-koans-gemini.yaml"

  providers:

    # =================================================================
    # ANTHROPIC
    # =================================================================
    - name: anthropic
      #disabled: true
      client-config:
        api-key: "${ANTHROPIC_API_KEY}"            # falls back to $ANTHROPIC_API_KEY
        request-timeout: 10m          
      retry-policy:
        max-retry-attempts: 2
        initial-delay-seconds: 10
      runs:
        - name: "Claude Opus 5 (high thinking)"
          model: "claude-opus-5"
          max-requests-per-minute: 20
          model-parameters:
            max-tokens: 16384
            effort: "high"
            stream: true

        - name: "Claude Opus 5.5 (high thinking)"
          model: "claude-opus-5-5"
          max-requests-per-minute: 20
          model-parameters:
            max-tokens: 16384
            effort: "high"
            stream: true

        - name: "Claude Sonnet 5 (extended thinking)"
          model: "claude-sonnet-5"
          max-requests-per-minute: 20
          model-parameters:
            max-tokens: 16384
            effort: "high"
            stream: true

        - name: "Claude Haiku 4.5 (default effort)"
          model: "claude-haiku-4-5-20251001"
          max-requests-per-minute: 20
          model-parameters:
            max-tokens: 16384

        - name: "Claude Fable 5.1 (high thinking)"
          model: "claude-fable-5-1"
          max-requests-per-minute: 10
          model-parameters:
            max-tokens: 16384
            effort: "high"
            stream: true

    # =================================================================
    # OPENAI
    # =================================================================
    - name: openai
      #disabled: true
      client-config:
        api-key: "${OPENAI_API_KEY}"            # falls back to $OPENAI_API_KEY
      retry-policy:
        max-retry-attempts: 2
        initial-delay-seconds: 10
      runs:
        - name: "GPT-5.6 Sol (high reasoning)"
          model: "gpt-5.6-sol"
          max-requests-per-minute: 10
          model-parameters:
            reasoning-effort: "high"
            verbosity: "medium"

        - name: "GPT-5.6 Terra (high reasoning)"
          model: "gpt-5.6-terra"
          max-requests-per-minute: 10
          model-parameters:
            reasoning-effort: "high"
            verbosity: "medium"

        - name: "GPT-5 Mini (high effort)"
          model: "gpt-5-mini"
          max-requests-per-minute: 20
          model-parameters:
            reasoning-effort: "high" 

        - name: "GPT-5 Mini (low effort)"
          model: "gpt-5-mini"
          max-requests-per-minute: 20
          model-parameters:
            reasoning-effort: "low" 

        - name: "GPT-6 Astra (high reasoning)"
          model: "gpt-6-astra"
          max-requests-per-minute: 10
          model-parameters:
            reasoning-effort: "high"
            verbosity: "medium"

        - name: "GPT-5.6 Luna (high reasoning)"
          model: "gpt-5.6-luna"
          max-requests-per-minute: 10
          model-parameters:
            reasoning-effort: "high"
            verbosity: "medium"

    
    # =================================================================
    # GOOGLE
    # =================================================================
    - name: google
      #disabled: true
      client-config:
        api-key: ""            # falls back to $GOOGLE_API_KEY, or Vertex AI / ADC when unset
        project: ""            # falls back to $GOOGLE_CLOUD_PROJECT (required for ADC)
        location: "global"     # falls back to $GOOGLE_CLOUD_LOCATION / $GOOGLE_CLOUD_REGION
      retry-policy:
        max-retry-attempts: 2
        initial-delay-seconds: 10
      runs:
        - name: "Gemini 3.1 Pro"
          model: "gemini-3.1-pro-preview"  
          max-requests-per-minute: 10
          model-parameters:
            thinking-level: "high"

        - name: "Gemini 2.5 Flash (control)"
          model: "gemini-2.5-flash"
          max-requests-per-minute: 3 

    # =================================================================
    # BEDROCK -- non-Claude, non-OpenAI families (parallel with above)
    # =================================================================
    - name: bedrock
      #disabled: true
      retry-policy:
        max-retry-attempts: 2
        initial-delay-seconds: 10
      client-config:
        api-key: ""
        region: "us-east-1"
        endpoint: "https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1"
      runs:
        - name: "DeepSeek V3.2"
          model: "deepseek.v3.2"
          max-requests-per-minute: 10
          model-parameters:
            response-format: "json-object"
            max-tokens: 16384

        - name: "Grok 4.6 (xAI family)"
          model: "global.xai.grok-4.6"
          max-requests-per-minute: 10
          model-parameters:
            response-format: "json-schema"
            max-tokens: 16384

 
