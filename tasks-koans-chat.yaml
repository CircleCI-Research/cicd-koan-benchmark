task-config:
  validation-rules:
    case-sensitive: false
    ignore-whitespace: true

  tasks:
  - name: "test/koan03/triage - wait for db connection refused"
    prompt: |
      Requirement: The job must provide the PostgreSQL dependency required by the
      application before the database readiness check is expected to succeed.
      Determine the root cause and the appropriate fix from the frozen
      configuration and execution evidence below.

      Frozen config from corpus/koans-03-databases/config.yml:
      ```yaml
      version: 2
      jobs:
        build:
          docker:
            - image: circleci/node
          steps:
            - checkout # check out the code in the project directory
            - run: echo "hello world" # run the `echo` command
            - run:
                name: install dockerize # This is a utility that will attempt to connect to a database, in place of an application for this sample.
                command: wget https://github.com/jwilder/dockerize/releases/download/$DOCKERIZE_VERSION/dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz && sudo tar -C /usr/local/bin -xzvf dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz && rm dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz
                environment:
                  DOCKERIZE_VERSION: v0.3.0
            - run:
                name: Wait for db # If no database is found in 1 minute the job will fail.
                command: dockerize -wait tcp://localhost:5432 -timeout 1m
      ```

      Frozen log from corpus/koans-03-databases/job.log:
      ```text
