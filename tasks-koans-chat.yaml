      2026/08/17 20:38:42 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:38:47 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:38:52 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:38:57 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:39:02 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:39:07 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:39:12 Problem with dial: dial tcp 127.0.0.1:5432: getsockopt: connection refused. Sleeping 5s
      2026/08/17 20:39:17 Timeout after 1m0s waiting on dependencies to become available: [tcp://localhost:5432]

      Exited with code exit status 1
      CircleCI received exit code 1
      ```

    response-result-format:
      type: object
      additionalProperties: false
      properties:
        root_cause:
          type: string
          enum:
            - no_postgres_service_container
            - dockerize_not_installed
            - wait_timeout_too_short
            - wrong_wait_port
            - node_image_missing_postgres_client
        fix:
          type: string
          enum:
            - add_postgres_service_image
            - increase_timeout
            - install_postgres_via_apt
            - remove_wait_step
            - change_wait_host
      required: ["root_cause", "fix"]
    expected-result:
      - root_cause: no_postgres_service_container
        fix: add_postgres_service_image

  - name: "build/koan05/triage - ruby missing after checkout"
    prompt: |
      Requirement: The build must install Ruby version 2.6.3 before the Ruby
      version check runs. Determine whether an installation was attempted and
      which available configuration change satisfies that requirement.

      Frozen config from corpus/koans-05-orbs/config.yml:
      ```yaml
      version: 2.1

      orbs:
        # Add Orb here

      jobs:
        build:
          docker:
            - image: cimg/base:stable
          steps:
            - checkout
            # Add step below to install Ruby version 2.6.3

            
            - run: ruby -v

      workflows:
        run-jobs:
          jobs:
            - build
      ```

      Frozen log from corpus/koans-05-orbs/job.log:
      ```text
      #!/bin/bash -eo pipefail
      ruby -v
      /bin/bash: ruby: command not found

      Exited with code exit status 127
      CircleCI received exit code 127
      ```

    response-result-format:
      type: object
      additionalProperties: false
      properties:
        install_attempted: { type: boolean }
        fix:
          type: string
          enum:
            - add_ruby_orb
            - change_base_image
            - install_via_apt
            - increase_timeout
      required: ["install_attempted", "fix"]
    expected-result:
      - install_attempted: false
        fix: add_ruby_orb

  - name: "build/koan06/triage - yarn offline cache miss"
    prompt: |
      Requirement: The build must continue using the fixed `--offline` flag.
      Configure caching so the required Yarn cache can be restored before
      dependency installation and saved for subsequent builds. The cache key
      must be based on the project's dependency manifest. Determine which cache
      steps are missing and which file the key should checksum, subject to the
      fixed offline constraint.

      Frozen config from corpus/koans-06-caching/config.yml:
      ```yaml
      version: 2.1

      jobs:
        build:
          docker:
            - image: cimg/node:current
          steps:
            - checkout
            # Uncomment below and set the key to point at the proper file
            #- restore_cache:
                #name: Restore Yarn Package Json Cache
                #keys:            
            - run:
                name: Install Dependencies
                command: yarn install --offline
            # Uncomment below and set the key to point at the proper file
            #- save_cache:
                #name: Save Yarn Package Json Cache
                #key: 
                #paths:
                  #- ~/.cache/yarn

      workflows:
        cache-save-and-restore:
          jobs:
            - build
      ```

      Frozen log from corpus/koans-06-caching/job.log:
      ```text
      #!/bin/bash -eo pipefail
      yarn install --offline

      yarn install v1.22.22
      info No lockfile found.
      [1/4] Resolving packages...
      error Couldn't find any versions for "left-pad" that matches "1.3.0" in our cache (possible versions are ""). This is usually caused by a missing entry in the lockfile, running Yarn without the --offline flag may help fix this issue.
      info Visit https://yarnpkg.com/en/docs/cli/install for documentation about this command.

      Exited with code exit status 1
      CircleCI received exit code 1
      ```

    response-result-format:
      type: object
      additionalProperties: false
      properties:
        cache_restored: { type: boolean }
        checksum_target:
          type: string
          enum:
            - package.json
            - yarn.lock
            - package-lock.json
            - .cache/yarn
        fix:
          type: string
          enum:
            - enable_restore_and_save_cache
            - drop_offline_flag
            - checksum_yarn_lock
            - restore_only
            - save_only
      required: ["cache_restored", "checksum_target", "fix"]
    expected-result:
      - cache_restored: false
        checksum_target: package.json
        fix: enable_restore_and_save_cache

  - name: "test/koan07/triage - junit written not published"
    prompt: |
      Requirement: The test results produced by the test step must be displayed
      in the test summary tab and the same results file must also be available
      as an artifact. Determine the publication configuration and the observed
      job state from the frozen configuration and execution evidence.

      Frozen config from corpus/koans-07-test-summary/config.yml:
      ```yaml
      version: 2.1
      jobs:
        build:
          docker:
            - image: cimg/node:current
          steps:
            - checkout
            - run:
                name: Run tests
                command: |
                  mkdir -p ~/project/results
                  printf '%s\n' \
                    '<?xml version="1.0" encoding="UTF-8"?>' \
                    '<testsuite name="koans" tests="1" failures="0" errors="0">' \
                    '<testcase classname="koans" name="exports_results"/>' \
                    '</testsuite>' \
                    > ~/project/results/test_results.xml
                  echo "Wrote ~/project/results/test_results.xml"
                  exit 1
      workflows:
        build:
          jobs:
            - build
      ```

      Frozen log from corpus/koans-07-test-summary/job.log:
      ```text
      #!/bin/bash -eo pipefail
      mkdir -p ~/project/results
      printf '%s\n' \
        '<?xml version="1.0" encoding="UTF-8"?>' \
        '<testsuite name="koans" tests="1" failures="0" errors="0">' \
        '<testcase classname="koans" name="exports_results"/>' \
        '</testsuite>' \
        > ~/project/results/test_results.xml
      echo "Wrote ~/project/results/test_results.xml"
      exit 1

      Wrote ~/project/results/test_results.xml

      Exited with code exit status 1
      CircleCI received exit code 1
      ```

    response-result-format:
      type: object
      additionalProperties: false
      properties:
        results_produced: { type: boolean }
        job_green: { type: boolean }
        missing_store_test_results: { type: boolean }
        missing_store_artifacts: { type: boolean }
        fix:
          type: string
          enum:
            - add_store_test_results_and_store_artifacts
            - set_upload_true
            - store_artifacts_only
            - store_test_results_only
            - remove_exit_1_only
      required:
        - results_produced
        - job_green
        - missing_store_test_results
        - missing_store_artifacts
        - fix
    expected-result:
      - results_produced: true
        job_green: false
        missing_store_test_results: true
        missing_store_artifacts: true
        fix: add_store_test_results_and_store_artifacts

  - name: "deploy/koan08/triage - deploy ran off production"
    prompt: |
      Requirement: The deploy job must run only when the commit is on the
      production branch. Determine whether the observed workflow satisfies that
      requirement and identify the workflow configuration that controls the
      deploy job's branch eligibility.

      Frozen config from corpus/koans-08-branch-filters/config.yml:
      ```yaml
      version: 2.1

      jobs:
        build:
          docker:
            - image: cimg/base:2022.10
          steps:
            - checkout
            - run: echo "Building complete"
        test-production:
          docker:
            - image: cimg/base:2022.10
          steps:
            - checkout
            - run: echo "Testing complete"
        deploy:
          docker:
            - image: cimg/base:2022.10
          steps:
            - checkout
            - run: echo "Deploy complete"

      workflows:
        build-test-and-deploy:
          jobs:
            - build
            - test-production:
                requires:
                  - build
            - deploy:
                requires:
                  - test-production
      ```

      Frozen workflow from corpus/koans-08-branch-filters/workflow.txt:
      ```text
      pipeline:  #151
      branch:    koans-08-branch-filters      
      commit:    69ba97c "Freeze koans-08-branch-filters from CircleCI-Training-Koans."
      trigger:   API

