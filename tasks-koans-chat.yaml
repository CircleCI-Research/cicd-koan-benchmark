      deploy job steps:
        Spin up environment              SUCCESS  20s
        Preparing environment variables  SUCCESS   0s
        Checkout code                    SUCCESS   0s
        echo "Deploy complete"           SUCCESS   0s
      ```

    response-result-format:
      type: object
      additionalProperties: false
      properties:
        pipeline_green: { type: boolean }
        behaviour_correct: { type: boolean }
        fix_target_job:
          type: string
          enum:
            - deploy
            - build
            - test-production
            - all_jobs
        fix:
          type: string
          enum:
            - filters_branches_only_production
            - filters_branches_ignore_non_production
            - filters_on_job_definition
            - rely_on_requires
            - nothing_wrong
      required:
        - pipeline_green
        - behaviour_correct
        - fix_target_job
        - fix
    expected-result:
      - pipeline_green: true
        behaviour_correct: false
        fix_target_job: deploy
        fix: filters_branches_only_production

  - name: "test/koan04/triage - parallelism without split"
    prompt: |
      Requirement: The test suite must be divided across the configured parallel
      nodes so that each node executes only its assigned portion of the suite.
      Determine the configured parallelism, whether the suite actually split
      across nodes, and the required configuration change from the frozen
      artifacts.

      Frozen config from corpus/koans-04-parallelism/config.yml:
      ```yaml
      version: 2.1

      jobs:
        test:
          parallelism: 2
          docker:
            - image: cimg/base:2022.10
          steps:
            - checkout
            - run:
                name: Run tests
                command: |
                  echo "CIRCLE_NODE_INDEX=$CIRCLE_NODE_INDEX CIRCLE_NODE_TOTAL=$CIRCLE_NODE_TOTAL"
                  circleci tests glob "src/test_*.sh" | circleci tests split --split-by=name >/tmp/split.txt || true
                  echo "Split list: $(tr '\n' ' ' </tmp/split.txt)"
                  RAN=0
                  for f in src/test_*.sh; do
                    echo "Running $f on node $CIRCLE_NODE_INDEX"
                    bash "$f"
                    RAN=$((RAN + 1))
                  done
                  EXPECTED=$(wc -l </tmp/split.txt | tr -d ' ')
                  if [ -z "$EXPECTED" ] || [ "$EXPECTED" -eq 0 ]; then
                    EXPECTED=1
                  fi
                  if [ "$CIRCLE_NODE_TOTAL" -gt 1 ] && [ "$RAN" -ne "$EXPECTED" ]; then
                    echo "Ran $RAN file(s); split list had $EXPECTED"
                    exit 1
                  fi

      workflows:
        test-workflow:
          jobs:
            - test
      ```

